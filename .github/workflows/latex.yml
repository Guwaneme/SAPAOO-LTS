name: Build PDF

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: xu-cheng/latex-action@v4
        with:
          root_file: Ⅳ-B.tex

      - uses: actions/upload-artifact@v7
        with:
          name: PDF
          path: Ⅳ-B.pdf
          if-no-files-found: error
